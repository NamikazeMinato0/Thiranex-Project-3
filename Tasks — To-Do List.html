<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:oklch(97% .008 250);--surface:oklch(100% 0 0);--ink:oklch(24% .05 265);--muted:oklch(42% .04 265);
  --line:oklch(80% .02 255);--btn:oklch(46% .1 175);--btn-ink:oklch(100% 0 0);--ring:oklch(52% .22 355);--danger:oklch(46% .18 25);
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:oklch(20% .03 265);--surface:oklch(26% .035 265);--ink:oklch(95% .01 250);--muted:oklch(78% .03 255);--line:oklch(42% .03 265);--btn:oklch(80% .13 170);--btn-ink:oklch(20% .03 265);--ring:oklch(78% .17 355);--danger:oklch(78% .13 25)}
}
:root[data-theme="dark"]{--paper:oklch(20% .03 265);--surface:oklch(26% .035 265);--ink:oklch(95% .01 250);--muted:oklch(78% .03 255);--line:oklch(42% .03 265);--btn:oklch(80% .13 170);--btn-ink:oklch(20% .03 265);--ring:oklch(78% .17 355);--danger:oklch(78% .13 25)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font:1.125rem/1.5 var(--font);color-scheme:light dark}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(color-mix(in oklch,var(--ink) 7%,transparent) 1px,transparent 1px) 0 0/2rem 2rem,linear-gradient(90deg,color-mix(in oklch,var(--ink) 7%,transparent) 1px,transparent 1px) 0 0/2rem 2rem;
  mask-image:linear-gradient(#000,transparent 60%)}
:focus-visible{outline:3px solid var(--ring);outline-offset:3px;border-radius:3px}
main{width:min(100% - 2rem,40rem);margin:0 auto;padding-block:clamp(1.5rem,6vw,4rem)}
h1{font-size:clamp(2.5rem,9vw,4rem);line-height:1;letter-spacing:-.035em;margin:0 0 1.5rem}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:.75rem}
button{font:inherit;color:inherit;cursor:pointer;min-height:2.75rem;min-width:2.75rem;padding:.4rem .8rem;background:transparent;border:2px solid transparent;border-radius:.5rem}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.55;cursor:not-allowed}
.add{display:flex;gap:.5rem;padding:.6rem;margin-bottom:1rem}
.add input{flex:1;min-width:0}
input[type=text]{font:inherit;color:var(--ink);background:var(--paper);min-height:2.75rem;padding:.5rem .75rem;border:2px solid var(--ink);border-radius:.4rem}
.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:700}
.primary:hover:not(:disabled){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters{display:flex;gap:.25rem;margin-bottom:1rem}
.filters a{display:inline-flex;align-items:center;gap:.4rem;min-height:2.75rem;padding:.4rem .9rem;border-bottom:3px solid transparent;color:var(--ink);text-decoration:none}
.filters a:hover{border-color:var(--line)}
.filters a[aria-current="page"]{font-weight:700;border-color:var(--ring)}
.filters small{color:var(--muted);font-size:.9rem}
ul.list{list-style:none;margin:0;padding:0;overflow:hidden}
.item{display:flex;align-items:center;gap:.5rem;padding:.35rem .6rem;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:hover,.item:focus-within{background:color-mix(in oklch,var(--ring) 8%,transparent)}
.check{width:1.4rem;height:1.4rem;flex:none;accent-color:var(--btn);margin:.6rem}
.item label{flex:1;overflow-wrap:anywhere;padding:.4rem 0;cursor:pointer}
.item.done label{color:var(--muted);text-decoration:line-through}
.item .edit{flex:1;min-width:0}
.item .del{color:var(--danger)}
.empty{padding:1.5rem;color:var(--muted);margin:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;margin-top:1rem;color:var(--muted)}
.bar p{margin:0}
.warn{margin:1rem 0 0;padding:.75rem 1rem;border:2px solid var(--danger);border-radius:.5rem}
@media (prefers-reduced-motion:no-preference){button,.filters a{transition:background-color .15s,border-color .15s}}
@media (forced-colors:active){.panel,.primary{border:2px solid CanvasText}}
</style>
</head>
<body>
<main>
<h1>Tasks</h1>

<form class="panel add" id="add-form" autocomplete="off">
  <label class="vh" for="new-task">New task</label>
  <input type="text" id="new-task" placeholder="What needs doing?" maxlength="200" required>
  <button class="primary" type="submit">Add task</button>
</form>

<nav class="filters" aria-label="Filter tasks">
  <a href="#all" data-filter="all">All <small></small></a>
  <a href="#active" data-filter="active">Active <small></small></a>
  <a href="#completed" data-filter="completed">Completed <small></small></a>
</nav>

<section class="panel" aria-label="Task list">
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden></p>
</section>

<div class="bar">
  <p id="count"></p>
  <span>
    <button type="button" id="toggle-all"></button>
    <button type="button" id="clear-done">Clear completed</button>
  </span>
</div>
<p class="warn" id="warn" role="alert" hidden>Your browser blocked saving, so changes will be lost when you close this page.</p>
<p class="vh" id="status" role="status" aria-live="polite"></p>
</main>

<script>
"use strict";

/* ---------- 1. Persistence layer: the only code that touches localStorage ---------- */
const KEY = "todo-app.v1";
const storage = {
  load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY) || "[]");
      // Validate shape: never trust stored data
      return Array.isArray(data)
        ? data.filter(t => t && typeof t.id === "string" && typeof t.text === "string")
              .map(t => ({ id: t.id, text: t.text, done: Boolean(t.done) }))
        : [];
    } catch { return []; }
  },
  save(todos) {
    try { localStorage.setItem(KEY, JSON.stringify(todos)); $("#warn").hidden = true; }
    catch { $("#warn").hidden = false; }
  }
};

/* ---------- 2. State: one object, changed only through commit() ---------- */
const filters = {
  all: () => true,
  active: t => !t.done,
  completed: t => t.done
};
const state = { todos: storage.load(), filter: filterFromHash(), editingId: null };

function filterFromHash() {
  const name = location.hash.slice(1);
  return name in filters ? name : "all";
}
const newId = () => crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2);

/** Apply a change, save automatically, redraw. */
function commit(change, announcement, focusTarget) {
  change();
  storage.save(state.todos);
  render();
  if (announcement) $("#status").textContent = announcement;
  if (focusTarget) focusTarget();
}

/* ---------- 3. CRUD operations ---------- */
const findTodo = id => state.todos.find(t => t.id === id);

function createTodo(text) {
  commit(() => state.todos.push({ id: newId(), text, done: false }), `Added “${text}”.`);
}
function toggleTodo(id) {
  const t = findTodo(id);
  commit(() => { t.done = !t.done; }, `${t.done ? "Reopened" : "Completed"} “${t.text}”.`);
}
function updateTodo(id, text) {
  const t = findTodo(id);
  const clean = text.trim();
  if (!clean) return deleteTodo(id);
  commit(() => { state.editingId = null; t.text = clean; }, `Updated task.`,
         () => $(`[data-id="${id}"] [data-action="edit"]`)?.focus());
}
function deleteTodo(id) {
  const t = findTodo(id);
  commit(() => {
    state.todos = state.todos.filter(x => x.id !== id);
    state.editingId = null;
  }, `Deleted “${t.text}”.`, () => $("#new-task").focus());
}

/* ---------- 4. Rendering: build DOM with createElement (no innerHTML = no XSS) ---------- */
function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function itemNode(t) {
  const li = el("li", { className: "item" + (t.done ? " done" : "") });
  li.dataset.id = t.id;

  const box = el("input", { type: "checkbox", className: "check", id: "c-" + t.id, checked: t.done });
  box.dataset.action = "toggle";

  if (state.editingId === t.id) {
    const input = el("input", { type: "text", className: "edit", value: t.text, maxLength: 200 });
    input.setAttribute("aria-label", "Edit task. Enter saves, Escape cancels.");
    li.append(box, input);
  } else {
    const label = el("label", { htmlFor: box.id, title: "Double-click to edit" }, t.text);
    label.dataset.action = "label";
    const edit = el("button", { type: "button", textContent: "Edit" });
    edit.dataset.action = "edit";
    edit.setAttribute("aria-label", `Edit “${t.text}”`);
    const del = el("button", { type: "button", className: "del", textContent: "Delete" });
    del.dataset.action = "delete";
    del.setAttribute("aria-label", `Delete “${t.text}”`);
    li.append(box, label, edit, del);
  }
  return li;
}

const list = $("#list");
function render() {
  const { todos, filter } = state;
  const visible = todos.filter(filters[filter]);
  list.replaceChildren(...visible.map(itemNode));

  const left = todos.filter(filters.active).length;
  const done = todos.length - left;

  // empty state tells people what to do next
  const empty = $("#empty");
  empty.hidden = visible.length > 0;
  empty.textContent = !todos.length ? "No tasks yet. Add your first one above."
    : filter === "active" ? "Nothing left to do. Nice work."
    : "No completed tasks yet.";

  document.querySelectorAll("[data-filter]").forEach(a => {
    const n = { all: todos.length, active: left, completed: done }[a.dataset.filter];
    a.querySelector("small").textContent = n;
    a.toggleAttribute("aria-current", a.dataset.filter === filter);
    if (a.dataset.filter === filter) a.setAttribute("aria-current", "page");
  });

  $("#count").textContent = `${left} ${left === 1 ? "task" : "tasks"} left`;
  $("#clear-done").disabled = done === 0;
  const tg = $("#toggle-all");
  tg.disabled = todos.length === 0;
  tg.textContent = left === 0 && todos.length ? "Reopen all" : "Complete all";

  // after entering edit mode, put the cursor in the field
  const field = list.querySelector(".edit");
  if (field) { field.focus(); field.setSelectionRange(field.value.length, field.value.length); }
}

/* ---------- 5. Events: ONE delegated listener per event type on the list ---------- */
function idOf(target) { return target.closest("li")?.dataset.id; }
function startEdit(id) { commit(() => { state.editingId = id; }); }

list.addEventListener("click", e => {
  const action = e.target.closest("[data-action]")?.dataset.action;
  const id = idOf(e.target);
  if (action === "edit") startEdit(id);
  if (action === "delete") deleteTodo(id);
});
list.addEventListener("change", e => {
  if (e.target.matches('[data-action="toggle"]')) toggleTodo(idOf(e.target));
});
list.addEventListener("dblclick", e => {
  if (e.target.matches('[data-action="label"]')) startEdit(idOf(e.target));
});
list.addEventListener("keydown", e => {
  if (!e.target.matches(".edit")) return;
  if (e.key === "Enter") updateTodo(idOf(e.target), e.target.value);
  if (e.key === "Escape") {
    const id = idOf(e.target);
    commit(() => { state.editingId = null; }, null, () => $(`[data-id="${id}"] [data-action="edit"]`)?.focus());
  }
});
// focusout (unlike blur) bubbles, so it can be delegated too
list.addEventListener("focusout", e => {
  if (e.target.matches(".edit") && state.editingId === idOf(e.target)) updateTodo(idOf(e.target), e.target.value);
});

/* Static controls */
$("#add-form").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("#new-task");
  const text = input.value.trim();
  if (!text) return;
  createTodo(text);
  input.value = "";
  input.focus();
});
$("#clear-done").addEventListener("click", () => {
  const n = state.todos.filter(filters.completed).length;
  commit(() => { state.todos = state.todos.filter(filters.active); }, `Cleared ${n} completed ${n === 1 ? "task" : "tasks"}.`);
});
$("#toggle-all").addEventListener("click", () => {
  const allDone = state.todos.every(t => t.done);
  commit(() => state.todos.forEach(t => { t.done = !allDone; }), allDone ? "Reopened all tasks." : "Completed all tasks.");
});

/* Filtering is driven by the URL hash, so Back/Forward and bookmarks work */
window.addEventListener("hashchange", () => { state.filter = filterFromHash(); state.editingId = null; render(); });
/* Keep other open tabs in sync */
window.addEventListener("storage", e => { if (e.key === KEY) { state.todos = storage.load(); render(); } });

function $(sel) { return document.querySelector(sel); }
render();
</script>
</body>
</html>
